services:
  app-018:
    build: .
    image: app-018-feature-10:latest
    container_name: app-018-feature-10
    ports:
      - "8188:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
